<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我 - 我的個人作品集網站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>聯絡我</h1>
        <nav>
            <a href="index.html">關於我</a>
            <a href="gallery.html">作品集</a>
            <a href="contact.html">聯絡我</a>
        </nav>
    </header>

    <section id="contact">
        <div class="form-container">
            <h2>聯絡我們</h2>
            <p>請填寫以下表單，我們會盡快與您聯絡。</p>
            <form id="contactForm" action="https://formspree.io/f/yourformid" method="POST">
                <div class="form-group">
                    <label for="name">姓名:</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入您的姓名">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="請輸入您的Email">
                </div>

                <div class="form-group">
                    <label for="message">訊息:</label>
                    <textarea id="message" name="message" required placeholder="請輸入您的訊息"></textarea>
                </div>

                <button type="submit">送出訊息</button>
            </form>
            <p id="formMessage"></p>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 我的個人作品集網站</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
